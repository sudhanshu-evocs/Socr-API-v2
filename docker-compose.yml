services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socr_api_backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  web:
    build:
      context: ./react-app
      dockerfile: Dockerfile
    container_name: socr_react_frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
