services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socr_api_backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app/src
    volumes:
      - ./src:/app/src
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - socr_net
    restart: unless-stopped

  web:
    build:
      context: ./react-app
      dockerfile: Dockerfile.dev
    container_name: socr_react_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./react-app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - socr_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  socr_net:
    driver: bridge
