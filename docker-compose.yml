services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socr_api_backend
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - TZ=Asia/Kolkata
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - socr_net
    restart: unless-stopped

  web:
    build:
      context: ./react-app
      dockerfile: Dockerfile
      target: production
    container_name: socr_react_frontend
    ports:
      - "80:80"
    networks:
      - socr_net
    depends_on:
      - api
    restart: unless-stopped

networks:
  socr_net:
    driver: bridge
