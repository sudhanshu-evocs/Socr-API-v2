[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuverus"
version = "0.3.4"
description = "DocuVerus document metadata validation library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF==1.26.7",
    "pydantic==2.12.5",
    "lxml==6.0.2",
]

[project.optional-dependencies]
server = [
    "Flask==2.1.3",
    "Werkzeug==2.3.7",
    "flask-cors==4.0.1",
]
dev = [
    "pytest==8.3.2",
    "pre-commit==3.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["docuverus*"]

[tool.setuptools.package-data]
docuverus = [
    "RuleEvaluators/TemplateJson/**/*.json",
    "Utils/*.json",
]

[tool.black]
line-length = 140
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "test_suite",
    "scripts/tests"
]
