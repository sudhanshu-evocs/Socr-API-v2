name: $(TeamProject)_${{ parameters.projectName }}_${{ parameters.env }}_environment_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger: none

parameters:
  - name: env
    type: string
    values:
      - qa4
      - custom
    default: qa4
    displayName: "Select the environment for deployment"

  - name: customEnv
    type: string
    default: "None"
    displayName: "If you selected 'custom', enter the environment name"

  - name: projectName
    type: string
    values:
      - socr-api-v2
    default: socr-api-v2
    displayName: "Select the project to build"

variables:
  - ${{ if ne(parameters.env, 'custom') }}:
      - group: vars-aks-${{ parameters.env }}
  - ${{ if eq(parameters.env, 'custom') }}:
      - group: vars-aks-${{ parameters.customEnv }}
  - group: vars-ado
  - group: vars-${{ parameters.projectName }}

  - name: selectedEnv
    ${{ if eq(parameters.env, 'custom') }}:
      value: ${{ parameters.customEnv }}
    ${{ if ne(parameters.env, 'custom') }}:
      value: ${{ parameters.env }}
  - name: TARGET_FILE
    value: "$(selectedEnv)/kustomization.yaml"
  - name: DOCKER_BUILDKIT
    value: "1"

pool:
  name: az-linux-agent

stages:
  - stage: Build_Docker
    displayName: Build Docker Image
    jobs:
      - job: BuildAndPushImage
        displayName: Build and push image
        steps:
          - checkout: self

          - task: Docker@2
            inputs:
              containerRegistry: '$(container-registry)'
              command: 'login'
            displayName: "Docker Login"

          - task: Bash@3
            displayName: "Pull previous image for cache"
            inputs:
              targetType: inline
              script: |
                docker pull $(container-registry-url)/$(service-docker-image):latest || true

          - task: Docker@2
            inputs:
              containerRegistry: '$(container-registry)'
              repository: '$(service-docker-image)'
              tags: |
                $(Build.BuildId)
                latest
              command: 'build'
              Dockerfile: 'Dockerfile'
              buildContext: '.'
              addPipelineData: false
              arguments: >-
                --cache-from $(container-registry-url)/$(service-docker-image):latest
                --build-arg BUILDKIT_INLINE_CACHE=1
            displayName: "Docker Build"

          - task: Docker@2
            inputs:
              containerRegistry: '$(container-registry)'
              repository: '$(service-docker-image)'
              tags: |
                $(Build.BuildId)
                latest
              command: 'push'
            displayName: "Docker Push"

          - task: Docker@2
            inputs:
              containerRegistry: '$(container-registry)'
              command: 'logout'
            displayName: "Logout Docker"

          - script: echo "Image tag $(Build.BuildId)"
            displayName: Image tag $(Build.BuildId)

  - stage: Update_Image_Tag
    displayName: Update image tag
    dependsOn: Build_Docker
    jobs:
      - deployment: UpdateTag
        displayName: Update deploy repo tag
        environment: "${{ parameters.projectName }}-${{ variables.selectedEnv }}"
        timeoutInMinutes: 15
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                - task: CmdLine@2
                  inputs:
                    script: |
                      git clone --branch $(branch) https://$(PERSONAL_ACCESS_TOKEN)@dev.azure.com/Docuverus/DVProducts/_git/$(DEPLOY_REPO)
                      echo "Cloned $(DEPLOY_REPO) repository successfully."
                      cd $(DEPLOY_REPO)
                      git fetch
                      echo "Checkout to branch $(branch) . . ."
                      git checkout $(branch)
                  displayName: checkout deploy repo

                - task: CmdLine@2
                  inputs:
                    script: |
                      mkdir -p "$(Pipeline.Workspace)/tools"
                      if [ ! -x "$(Pipeline.Workspace)/tools/yq" ]; then
                        curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -o "$(Pipeline.Workspace)/tools/yq"
                        chmod +x "$(Pipeline.Workspace)/tools/yq"
                      fi
                      echo "##vso[task.prependpath]$(Pipeline.Workspace)/tools"
                      yq --version
                  displayName: ensure yq

                - task: CmdLine@2
                  inputs:
                    script: |
                      ls
                      yq eval '.images[0].newTag' "$(TARGET_FILE)"
                      echo "### $(TARGET_FILE): "
                      cat "$(TARGET_FILE)"
                    workingDirectory: '$(Build.SourcesDirectory)/$(DEPLOY_REPO)'
                  displayName: "Verify current image tag"

                - task: CmdLine@2
                  inputs:
                    script: |
                      yq eval --inplace '.images[0].newTag="$(Build.BuildId)"' "$(TARGET_FILE)"
                      echo "### Updated $(TARGET_FILE): "
                      cat "$(TARGET_FILE)"
                    workingDirectory: '$(Build.SourcesDirectory)/$(DEPLOY_REPO)'
                  displayName: change image tag

                - task: CmdLine@2
                  inputs:
                    script: |
                      git config --global user.email $(ADO_USER_EMAIL)
                      git config --global user.name $(ADO_USER)
                      echo "### Checking status prior..."
                      git status
                      git add "$(TARGET_FILE)"
                      echo "### Added files. Commiting..."
                      git commit -m "Auto tag update ${{ variables.selectedEnv }} env - TAG: $(Build.BuildId)"
                      git status
                      echo "### Checking diff..."
                      git diff origin/$(branch) $(TARGET_FILE)
                      git push --set-upstream origin $(branch)
                      tag_name="auto/$(branch)/$(Build.BuildId)"
                      echo "### Creating tag ${tag_name}..."
                      git tag "${tag_name}"
                      echo "### Pushing tag ${tag_name}..."
                      git push origin "${tag_name}"
                    workingDirectory: '$(Build.SourcesDirectory)/$(DEPLOY_REPO)'
                  displayName: update tag

                - task: CmdLine@2
                  inputs:
                    script: |
                      rm -rf $(DEPLOY_REPO)
                  condition: always()
                  displayName: cleanup
